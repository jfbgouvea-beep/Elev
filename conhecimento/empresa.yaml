  - Conversa inicial para entender o negocio e o objetivo
  - Proposta com escopo, prazo e investimento definidos por escrito
  - Desenvolvimento com acompanhamento do cliente
  - Entrega, treinamento de uso e suporte combinado em contrato

diferenciais:
  - Preco bem mais acessivel que contratar um programador por conta ou uma agencia de marca conhecida
