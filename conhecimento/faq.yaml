# =====================================================================
# Perguntas frequentes com resposta OFICIAL da ELEV.
# So entra aqui o que a equipe confirmou. Se a resposta ainda nao existe,
# nao escreva nada: o agente vai dizer que verifica com a equipe.
# =====================================================================

- pergunta: Quanto custa?
  resposta: >-
    Os valores iniciais sao estes: site basico a partir de R$ 150 (ate R$ 250);
    site completo a partir de R$ 250 (ate R$ 400); cardapio digital a partir de
    R$ 100 (ate R$ 180); agendamento online a partir de R$ 150 (ate R$ 250);
    site + agendamento a partir de R$ 300 (ate R$ 500); site + cardapio a partir
    de R$ 250 (ate R$ 400); pacote completo a partir de R$ 400 (ate R$ 600).
    Onde o projeto cai dentro da faixa depende do escopo, e a equipe confirma o
    valor por escrito antes de comecar.
  tags: [preco, valor, orcamento, custo, quanto, tabela]

- pergunta: Por que a ELEV e mais barata que outras agencias?
  resposta: >-
    A ELEV e uma equipe enxuta, sem a estrutura de uma agencia grande, e trabalha
    com escopo do tamanho certo para pequenos negocios. Isso deixa o preco bem
    mais acessivel que contratar um programador por conta ou fechar com uma marca
    conhecida, entregando a mesma solucao.
  tags: [barato, acessivel, caro, concorrente, comparacao, programador]

- pergunta: Depois de pronto voces acompanham?
  resposta: >-
    Sim. A ELEV acompanha o site depois da entrega e faz a manutencao e os
    ajustes necessarios para ele nao ficar parado no tempo. As condicoes desse
    acompanhamento sao combinadas na proposta.
  tags: [manutencao, acompanhamento, suporte, depois, ajuste]

- pergunta: Em quanto tempo fica pronto?
  resposta: >-
    O prazo varia conforme o escopo. Assim que a equipe entender o tamanho do
    projeto, ela te passa o prazo junto com a proposta.
  tags: [prazo, tempo, demora, entrega]

- pergunta: Voces atendem fora da cidade?
  resposta: >-
    O trabalho e feito de forma remota, entao a distancia normalmente nao e um
    impedimento. Vou confirmar com a equipe a cobertura de atendimento para o seu caso.
  tags: [regiao, cidade, distancia, remoto, presencial]

- pergunta: Voces disparam mensagem em massa no WhatsApp?
  resposta: >-
    Nao. A ELEV nao trabalha com disparo em massa nem com lista de contatos
    comprada. As automacoes que fazemos respondem quem procura o negocio e
    organizam esse atendimento.
  tags: [spam, disparo, massa, lista, marketing]

- pergunta: Quem cuida do site depois de pronto?
  resposta: >-
    A entrega inclui treinamento basico para o cliente atualizar o conteudo. A
    forma de suporte e manutencao continua e combinada no contrato, e a equipe
    explica isso na proposta.
  tags: [suporte, manutencao, depois, atualizacao]
